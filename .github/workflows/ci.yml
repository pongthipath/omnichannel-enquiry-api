name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run test:cov
      - run: npm run build
      - name: docker build (prod target)
        run: docker build --target prod -t omni-api:ci .
