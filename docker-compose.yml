# Local dev: everything with one command
#   cp .env.example .env && docker compose up -d
#   scale test: docker compose up -d --scale api=3 --scale worker=2
# api (via load balancer): http://localhost:4000/api · swagger: http://localhost:4000/api/docs
# traefik: http://localhost:8080 · rabbitmq: http://localhost:15672 · minio: http://localhost:9001 · mailpit: http://localhost:8025

services:
  traefik:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:4000
      - --api.dashboard=true
      - --api.insecure=true
    ports: ["4000:4000", "8080:8080"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASSWORD}
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: quay.io/minio/mc
    depends_on: [minio]
    env_file: .env
    entrypoint: >
      sh -c "sleep 3 && mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY}
      && mc mb -p local/$${S3_BUCKET}"

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

  # runs migrations once before any api/worker replica starts
  migrate:
    build: { context: ., target: dev }
    env_file: .env
    environment: &container-hosts
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379
      RMQ_URL: amqp://${RMQ_USER}:${RMQ_PASSWORD}@rabbitmq:5672
      S3_ENDPOINT: http://minio:9000
      SMTP_URL: smtp://mailpit:1025
    command: npm run migration:run
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., target: dev }
    env_file: .env
    environment: *container-hosts
    command: npm run start:dev
    volumes: ["./src:/app/src"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=PathPrefix(`/`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=4000
      - traefik.http.services.api.loadbalancer.healthcheck.path=/api/health/ready
      - traefik.http.services.api.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.api.loadbalancer.sticky.cookie=true
      - traefik.http.services.api.loadbalancer.sticky.cookie.name=srv_id
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  worker:
    build: { context: ., target: dev }
    env_file: .env
    environment: *container-hosts
    command: npm run start:worker:dev
    volumes: ["./src:/app/src"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

volumes:
  pgdata: {}
  miniodata: {}
